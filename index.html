<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷你城市 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1e1e1e;color:#eee;
  font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;}
#gameScreen{position:absolute;inset:0;display:flex;flex-direction:column;}
#topbar{flex:0 0 auto;background:#2b2b2b;padding:6px 8px;font-size:13px;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.row+.row{margin-top:6px;}
button{background:#3a3a3a;color:#eee;border:1px solid #555;border-radius:6px;
  padding:4px 8px;font-size:13px;cursor:pointer;font-family:inherit;}
button.active{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.res{display:flex;gap:10px;flex-wrap:wrap;}
.res span{white-space:nowrap;}
.res b{margin-left:2px;color:#ffd54f;font-weight:600;}
#tickInfo{color:#888;font-size:11px;}
#dayInfo{color:#ffd54f;font-size:12px;font-weight:600;}
#canvasWrap{flex:1 1 auto;position:relative;overflow:hidden;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#toolbar{flex:0 0 auto;background:#2b2b2b;display:flex;gap:6px;padding:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
#toolbar button{flex:0 0 auto;padding:8px 10px;font-size:12px;line-height:1.2;
  text-align:center;min-width:56px;}
#toolbar button small{display:block;color:#ffd54f;font-size:10px;margin-top:2px;}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.88);padding:10px 16px;border-radius:8px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:5;}
#toast.show{opacity:1;}
.menu-btn{width:240px;max-width:80vw;padding:14px 20px;font-size:16px;
  background:#3a3a3a;color:#eee;border:1px solid #555;border-radius:10px;
  cursor:pointer;font-family:inherit;transition:background .15s;}
.menu-btn:active{background:#4a4a4a;}
.menu-btn.primary{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.menu-btn.danger{background:#8b3a3a;border-color:#a44;color:#fff;}
.menu-btn:disabled{opacity:.4;cursor:not-allowed;}
#menuScreen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);
  gap:14px;padding:24px;}
#menuScreen h1{font-size:34px;margin-bottom:20px;font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,#4a90d9,#e6a23c);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#menuScreen .sub{color:#8899aa;font-size:12px;margin-top:20px;}
#settingsPanel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(0,0,0,0.88);
  gap:12px;padding:24px;}
#settingsPanel h2{font-size:24px;margin-bottom:20px;color:#fff;}
</style>
</head>
<body>
<div id="app">

  <div id="gameScreen">
    <div id="topbar">
      <div class="row" id="timeRow">
        <button data-speed="0">⏸</button>
        <button data-speed="1">▶1x</button>
        <button data-speed="3">▶3x</button>
        <span id="dayInfo"></span>
        <span id="tickInfo"></span>
        <button id="btnOpenSettings" style="margin-left:auto">⚙</button>
      </div>
      <div class="row res">
        <span>💰<b id="rMoney">0</b></span>
        <span>👥<b id="rPop">0</b></span>
        <span>⚡<b id="rPower">0</b></span>
        <span>💧<b id="rWater">0</b></span>
        <span>📦<b id="rGoods">0</b></span>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="toast"></div>
    </div>
    <div id="toolbar"></div>
  </div>

  <div id="menuScreen">
    <h1>🏙️ 迷你城市</h1>
    <button class="menu-btn primary" id="btnNew">开始新游戏</button>
    <button class="menu-btn" id="btnContinue" disabled>继续游戏</button>
    <button class="menu-btn" id="btnMenuSettings">设置</button>
    <div class="sub">v2.0 · 离线可玩 · 沙盒建造</div>
  </div>

  <div id="settingsPanel" style="display:none;">
    <h2>⚙ 设置</h2>
    <button class="menu-btn primary" id="btnCloseSettings">继续游戏</button>
    <button class="menu-btn" id="btnBackToMenu">保存并返回主菜单</button>
    <button class="menu-btn danger" id="btnRestart">重新开始（清空存档）</button>
    <button class="menu-btn danger" id="btnQuit">关闭游戏</button>
  </div>

</div>
<script> (function(){
'use strict';

// ========== 常量 ==========
const N = 10;
const CELL = 60;
const ROAD_WIDTH = 9;
const AGENT_RADIUS = 5;
const AGENT_SPEED = 90;           // 世界单位/秒
const MAX_AGENTS = 200;
const DAY_LENGTH = 10;
const MORNING_END = 5;
const SAVE_KEY = 'minicity_v2';
const dpr = Math.min(window.devicePixelRatio || 1, 2);

const BUILDINGS = {
  house:    { name:'住宅', short:'住', color:'#4a90d9', cost:100, powerNeed:1, waterNeed:1 },
  industry: { name:'工业', short:'工', color:'#8d6e63', cost:150, powerNeed:2, waterNeed:2 },
  power:    { name:'电厂', short:'电', color:'#e74c3c', cost:200, powerNeed:0, waterNeed:0, powerProd:20 },
  water:    { name:'水厂', short:'水', color:'#26c6da', cost:200, powerNeed:0, waterNeed:0, waterProd:20 },
  trade:    { name:'贸易', short:'贸', color:'#9b59b6', cost:250, powerNeed:1, waterNeed:0 },
};

const TOOLS = ['road','house','industry','power','water','trade','demolish'];

// ========== 状态 ==========
const state = {
  money: 1500,
  tool: 'road',
  speed: 1,
  tick: 0,
  cells: [],
  edgesH: [],
  edgesV: [],
  agents: [],
  nextId: 1,
  cellPower: new Set(),
  cellWater: new Set(),
  industryWorkers: {},
};

function resetState(){
  state.money = 1500;
  state.tool = 'road';
  state.speed = 1;
  state.tick = 0;
  state.cells = Array.from({length:N}, () => Array(N).fill(null));
  state.edgesH = Array.from({length:N+1}, () => Array(N).fill(false));
  state.edgesV = Array.from({length:N}, () => Array(N+1).fill(false));
  state.agents = [];
  state.nextId = 1;
  state.cellPower = new Set();
  state.cellWater = new Set();
  state.industryWorkers = {};
}
resetState();

// ========== 存档 ==========
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function save(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money: state.money, tick: state.tick,
      cells: state.cells,
      edgesH: state.edgesH, edgesV: state.edgesV,
      industryWorkers: state.industryWorkers,
    }));
  } catch(e){}
}
function load(){
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return false;
    const d = JSON.parse(s);
    state.money = typeof d.money === 'number' ? d.money : 1500;
    state.tick = d.tick || 0;
    state.cells = d.cells || Array.from({length:N}, () => Array(N).fill(null));
    state.edgesH = d.edgesH || Array.from({length:N+1}, () => Array(N).fill(false));
    state.edgesV = d.edgesV || Array.from({length:N}, () => Array(N+1).fill(false));
    state.industryWorkers = d.industryWorkers || {};
    if(state.cells.length !== N) resetState();
    if(state.edgesH.length !== N+1) state.edgesH = Array.from({length:N+1}, () => Array(N).fill(false));
    if(state.edgesV.length !== N) state.edgesV = Array.from({length:N}, () => Array(N+1).fill(false));
    state.agents = [];
    state.nextId = 1;
    state.cellPower = new Set();
    state.cellWater = new Set();
    return true;
  } catch(e){ return false; }
}

// ========== Canvas / 视口 ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1, offsetX = 0, offsetY = 0;
let userInteracted = false;

function fitView(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(w <= 0 || h <= 0) return;
  const total = N * CELL;
  scale = Math.min(w/total, h/total) * 0.92;
  offsetX = (w - total*scale) / 2;
  offsetY = (h - total*scale) / 2;
}
function resize(){
  const wrap = document.getElementById('canvasWrap');
  if(!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = Math.max(1, w*dpr);
  canvas.height = Math.max(1, h*dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  if(!userInteracted) fitView();
}
window.addEventListener('resize', resize);

function zoomAt(cx, cy, factor){
  const newScale = Math.max(0.3, Math.min(4, scale*factor));
  const wx = (cx - offsetX) / scale;
  const wy = (cy - offsetY) / scale;
  scale = newScale;
  offsetX = cx - wx*scale;
  offsetY = cy - wy*scale;
}

// ========== 坐标 ==========
function cellFromWorld(wx, wy){
  const c = Math.floor(wx / CELL);
  const r = Math.floor(wy / CELL);
  if(r < 0 || r >= N || c < 0 || c >= N) return null;
  return [r, c];
}

// 返回最近的边（H 或 V），带距离
function edgeFromWorld(wx, wy){
  const hRow = Math.round(wy / CELL);
  const hCol = Math.floor(wx / CELL);
  const hDist = Math.abs(wy - hRow*CELL);
  const hValid = hRow >= 0 && hRow <= N && hCol >= 0 && hCol < N && wx >= 0 && wx <= N*CELL;

  const vCol = Math.round(wx / CELL);
  const vRow = Math.floor(wy / CELL);
  const vDist = Math.abs(wx - vCol*CELL);
  const vValid = vCol >= 0 && vCol <= N && vRow >= 0 && vRow < N && wy >= 0 && wy <= N*CELL;

  if(!hValid && !vValid) return null;
  if(hValid && (!vValid || hDist <= vDist)) return { type:'h', r:hRow, c:hCol, dist:hDist };
  return { type:'v', r:vRow, c:vCol, dist:vDist };
}

// ========== 图 ==========
function cellEntryNodes(r, c){
  const set = new Set();
  if(state.edgesH[r] && state.edgesH[r][c]){
    set.add(r+','+c); set.add(r+','+(c+1));
  }
  if(state.edgesH[r+1] && state.edgesH[r+1][c]){
    set.add((r+1)+','+c); set.add((r+1)+','+(c+1));
  }
  if(state.edgesV[r] && state.edgesV[r][c]){
    set.add(r+','+c); set.add((r+1)+','+c);
  }
  if(state.edgesV[r] && state.edgesV[r][c+1]){
    set.add(r+','+(c+1)); set.add((r+1)+','+(c+1));
  }
  return [...set].map(s => s.split(',').map(Number));
}

function nodeNeighbors(r, c){
  const ns = [];
  if(r >= 0 && r <= N && c >= 0 && c < N && state.edgesH[r] && state.edgesH[r][c]) ns.push([r, c+1]);
  if(r >= 0 && r <= N && c > 0 && state.edgesH[r] && state.edgesH[r][c-1]) ns.push([r, c-1]);
  if(r >= 0 && r < N && c >= 0 && c <= N && state.edgesV[r] && state.edgesV[r][c]) ns.push([r+1, c]);
  if(r > 0 && r <= N && c >= 0 && c <= N && state.edgesV[r-1] && state.edgesV[r-1][c]) ns.push([r-1, c]);
  return ns;
}

function findPathBFS(starts, goals){
  if(starts.length === 0 || goals.length === 0) return null;
  const goalSet = new Set(goals.map(([r,c]) => r+','+c));
  const visited = new Map();
  const queue = [];
  for(const [r,c] of starts){
    const k = r+','+c;
    if(!visited.has(k)){ visited.set(k, null); queue.push(k); }
  }
  while(queue.length > 0){
    const cur = queue.shift();
    if(goalSet.has(cur)){
      const path = [];
      let k = cur;
      while(k !== null){
        const [r,c] = k.split(',').map(Number);
        path.unshift([r, c]);
        k = visited.get(k);
      }
      return path;
    }
    const [r, c] = cur.split(',').map(Number);
    for(const [nr, nc] of nodeNeighbors(r, c)){
      const nk = nr+','+nc;
      if(!visited.has(nk)){ visited.set(nk, cur); queue.push(nk); }
    }
  }
  return null;
}

function findPathBetweenCells(from, to){
  return findPathBFS(cellEntryNodes(from[0], from[1]), cellEntryNodes(to[0], to[1]));
}

function nodesToEdges(nodes){
  const edges = [];
  for(let i = 0; i < nodes.length - 1; i++){
    edges.push({ from: nodes[i], to: nodes[i+1] });
  }
  return edges;
}

// ========== 网络 BFS（电/水） ==========
function computeNetwork(plants){
  const visited = new Set();
  const queue = [];
  for(const [r, c] of plants){
    for(const [nr, nc] of cellEntryNodes(r, c)){
      const k = nr+','+nc;
      if(!visited.has(k)){ visited.add(k); queue.push([nr, nc]); }
    }
  }
  while(queue.length > 0){
    const [r, c] = queue.shift();
    for(const [nr, nc] of nodeNeighbors(r, c)){
      const k = nr+','+nc;
      if(!visited.has(k)){ visited.add(k); queue.push([nr, nc]); }
    }
  }
  return visited;
}

function cellHasAnyEntryIn(r, c, nodeSet){
  for(const [nr, nc] of cellEntryNodes(r, c)){
    if(nodeSet.has(nr+','+nc)) return true;
  }
  return false;
}

// ========== Agent ==========
function spawnAgent(kind, fromCell, toCell){
  if(state.agents.length >= MAX_AGENTS) return false;
  const nodePath = findPathBetweenCells(fromCell, toCell);
  if(!nodePath || nodePath.length < 2) return false;
  state.agents.push({
    id: state.nextId++,
    kind: kind,
    path: nodesToEdges(nodePath),
    pathIndex: 0,
    progress: 0,
    destCell: toCell,
  });
  return true;
}

function onAgentArrive(a){
  if(a.kind === 'worker'){
    const key = a.destCell[0] + ',' + a.destCell[1];
    state.industryWorkers[key] = (state.industryWorkers[key] || 0) + 1;
  } else if(a.kind === 'goods'){
    state.money += 20;
  }
}

function updateAgents(dt){
  const step = AGENT_SPEED * dt;
  for(let i = state.agents.length - 1; i >= 0; i--){
    const a = state.agents[i];
    let remain = step;
    while(remain > 0 && a.pathIndex < a.path.length){
      const remainingOnEdge = (1 - a.progress) * CELL;
      if(remain >= remainingOnEdge){
        remain -= remainingOnEdge;
        a.progress = 0;
        a.pathIndex++;
      } else {
        a.progress += remain / CELL;
        remain = 0;
      }
    }
    if(a.pathIndex >= a.path.length){
      onAgentArrive(a);
      state.agents.splice(i, 1);
    }
  }
}

// ========== Tick ==========
// [FIX1] 早上判定改为 tick 1..5 为早、6..10 为晚
function isMorning(){
  const t = (state.tick - 1 + DAY_LENGTH) % DAY_LENGTH;
  return t < MORNING_END;
}

function tick(){
  state.tick++;

  const powerPlants = [];
  const waterPlants = [];
  const houses = [];
  const industries = [];
  const trades = [];

  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(!cell) continue;
      if(cell.type === 'power') powerPlants.push([r,c]);
      else if(cell.type === 'water') waterPlants.push([r,c]);
      else if(cell.type === 'house') houses.push([r,c]);
      else if(cell.type === 'industry') industries.push([r,c]);
      else if(cell.type === 'trade') trades.push([r,c]);
    }
  }

  const powerNodes = computeNetwork(powerPlants);
  const waterNodes = computeNetwork(waterPlants);

  state.cellPower = new Set();
  state.cellWater = new Set();
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      if(!state.cells[r][c]) continue;
      const key = r+','+c;
      if(cellHasAnyEntryIn(r, c, powerNodes)) state.cellPower.add(key);
      if(cellHasAnyEntryIn(r, c, waterNodes)) state.cellWater.add(key);
    }
  }

  state.money -= powerPlants.length * 3;
  state.money -= waterPlants.length * 2;
  state.money -= trades.length * 2;

  // 早上：住宅派工人（只派往有电有水的工业）
  if(isMorning() && state.tick % 3 === 0){
    for(const [r, c] of houses){
      const key = r+','+c;
      if(!state.cellPower.has(key) || !state.cellWater.has(key)) continue;
      if(industries.length === 0) continue;
      let best = null, bestD = Infinity;
      for(const ind of industries){
        const indKey = ind[0]+','+ind[1];
        // [FIX2] 工业必须通电通水才接工
        if(!state.cellPower.has(indKey) || !state.cellWater.has(indKey)) continue;
        const d = Math.abs(ind[0]-r) + Math.abs(ind[1]-c);
        if(d < bestD){ bestD = d; best = ind; }
      }
      if(best) spawnAgent('worker', [r,c], best);
    }
  }

  // 晚上：工业送工人回家
  if(!isMorning() && state.tick % 3 === 0){
    for(const [r, c] of industries){
      const key = r+','+c;
      if((state.industryWorkers[key] || 0) <= 0) continue;
      if(houses.length === 0) continue;
      let best = null, bestD = Infinity;
      for(const h of houses){
        const d = Math.abs(h[0]-r) + Math.abs(h[1]-c);
        if(d < bestD){ bestD = d; best = h; }
      }
      // [FIX3] 先成功 spawn 再扣工人数，避免路断时工人凭空消失
      if(best && spawnAgent('workerHome', [r,c], best)){
        state.industryWorkers[key]--;
      }
    }
  }

  // 工业：有工人在岗 + 电 + 水 → 每 tick 产 1 个货物
  for(const [r, c] of industries){
    const key = r+','+c;
    if((state.industryWorkers[key] || 0) <= 0) continue;
    if(!state.cellPower.has(key) || !state.cellWater.has(key)) continue;
    if(trades.length === 0) continue;
    let best = null, bestD = Infinity;
    for(const t of trades){
      const d = Math.abs(t[0]-r) + Math.abs(t[1]-c);
      if(d < bestD){ bestD = d; best = t; }
    }
    if(best) spawnAgent('goods', [r,c], best);
  }

  if(state.tick % 10 === 0) save();
}

// ========== 放置 / 拆除 ==========
function placeRoad(edge){
  const arr = edge.type === 'h' ? state.edgesH : state.edgesV;
  if(!arr[edge.r] || arr[edge.r][edge.c] === undefined) return;
  if(arr[edge.r][edge.c]){ toast('这里已经有路了'); return; }
  if(state.money < 10){ toast('资金不足'); return; }
  state.money -= 10;
  arr[edge.r][edge.c] = true;
  save();
}

function removeRoad(edge){
  const arr = edge.type === 'h' ? state.edgesH : state.edgesV;
  if(!arr[edge.r] || !arr[edge.r][edge.c]) return false;
  arr[edge.r][edge.c] = false;
  state.money += 5;
  save();
  return true;
}

function placeBuilding(r, c){
  if(state.cells[r][c]){ toast('这里已经有建筑了'); return; }
  const type = state.tool;
  const b = BUILDINGS[type];
  if(!b) return;

  if(type === 'trade'){
    if(!(r === 0 || r === N-1 || c === 0 || c === N-1)){
      toast('贸易站必须建在地图边缘');
      return;
    }
  }

  const hasAdjacentRoad =
    (state.edgesH[r] && state.edgesH[r][c]) ||
    (state.edgesH[r+1] && state.edgesH[r+1][c]) ||
    (state.edgesV[r] && state.edgesV[r][c]) ||
    (state.edgesV[r] && state.edgesV[r][c+1]);
  if(!hasAdjacentRoad){
    toast('建筑必须紧挨着路');
    return;
  }

  if(state.money < b.cost){ toast('资金不足'); return; }
  state.money -= b.cost;
  state.cells[r][c] = { type: type };
  save();
}

function removeBuilding(r, c){
  const cell = state.cells[r][c];
  if(!cell) return false;
  state.money += Math.floor(BUILDINGS[cell.type].cost / 2);
  state.cells[r][c] = null;
  delete state.industryWorkers[r+','+c];
  save();
  return true;
}

// ========== 渲染 ==========
function roundRectPath(x, y, w, h, r){
  if(r > w/2) r = w/2;
  if(r > h/2) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const PAD = 8;
const CORNER = 10;

function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#161616';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*offsetX, dpr*offsetY);

  // 1. 格子背景
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const x = c*CELL + PAD;
      const y = r*CELL + PAD;
      const w = CELL - PAD*2;
      roundRectPath(x, y, w, w, CORNER);
      ctx.fillStyle = '#282828';
      ctx.fill();
    }
  }

  // 2. 道路
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = ROAD_WIDTH;

  for(let r = 0; r <= N; r++){
    for(let c = 0; c < N; c++){
      if(state.edgesH[r] && state.edgesH[r][c]){
        ctx.beginPath();
        ctx.moveTo(c*CELL, r*CELL);
        ctx.lineTo((c+1)*CELL, r*CELL);
        ctx.stroke();
      }
    }
  }
  for(let r = 0; r < N; r++){
    for(let c = 0; c <= N; c++){
      if(state.edgesV[r] && state.edgesV[r][c]){
        ctx.beginPath();
        ctx.moveTo(c*CELL, r*CELL);
        ctx.lineTo(c*CELL, (r+1)*CELL);
        ctx.stroke();
      }
    }
  }

  // 3. 建筑
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(!cell) continue;
      const b = BUILDINGS[cell.type];
      const x = c*CELL + PAD;
      const y = r*CELL + PAD;
      const w = CELL - PAD*2;
      const key = r+','+c;

      const powered = b.powerNeed === 0 || state.cellPower.has(key);
      const watered = b.waterNeed === 0 || state.cellWater.has(key);
      const active = powered && watered;

      roundRectPath(x, y, w, w, CORNER);
      ctx.globalAlpha = active ? 1 : 0.4;
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.short, x + w/2, y + w/2);

      if(!active){
        ctx.fillStyle = '#ff5050';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('!', x + w/2, y + 14);
      }

      if(cell.type === 'industry'){
        const wk = state.industryWorkers[key] || 0;
        if(wk > 0){
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('👷' + wk, x + w/2, y + w - 10);
        }
      }
    }
  }

  // 4. Agent
  for(const a of state.agents){
    if(a.pathIndex >= a.path.length) continue;
    const e = a.path[a.pathIndex];
    const fx = e.from[1]*CELL;
    const fy = e.from[0]*CELL;
    const tx = e.to[1]*CELL;
    const ty = e.to[0]*CELL;
    const px = fx + (tx - fx) * a.progress;
    const py = fy + (ty - fy) * a.progress;

    ctx.beginPath();
    ctx.arc(px, py, AGENT_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = (a.kind === 'worker' || a.kind === 'workerHome') ? '#2ecc71' : '#e67e22';
    ctx.fill();
  }
}

// ========== UI 更新 ==========
let lastUI = {};
function updateUI(){
  let pop = 0;
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(cell && cell.type === 'house'){
        const key = r+','+c;
        if(state.cellPower.has(key) && state.cellWater.has(key)) pop += 3;
      }
    }
  }
  const goodsCount = state.agents.filter(a => a.kind === 'goods').length;
  const day = Math.floor(state.tick / DAY_LENGTH) + 1;
  const isM = isMorning();

  const vals = {
    rMoney: Math.floor(state.money),
    rPop: pop,
    rPower: state.cellPower.size,
    rWater: state.cellWater.size,
    rGoods: goodsCount,
    dayInfo: (isM ? '☀' : '🌙') + ' Day ' + day,
    tickInfo: 'tick ' + state.tick,
  };
  for(const k in vals){
    if(lastUI[k] !== vals[k]){
      const el = document.getElementById(k);
      if(el) el.textContent = vals[k];
      lastUI[k] = vals[k];
    }
  }
}

// ========== 输入 ==========
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1400);
}

function handleTap(cssX, cssY){
  const wx = (cssX - offsetX) / scale;
  const wy = (cssY - offsetY) / scale;

  if(state.tool === 'road'){
    const edge = edgeFromWorld(wx, wy);
    if(edge) placeRoad(edge);
    return;
  }
  if(state.tool === 'demolish'){
    const cell = cellFromWorld(wx, wy);
    if(cell && state.cells[cell[0]][cell[1]]){
      removeBuilding(cell[0], cell[1]);
      return;
    }
    const edge = edgeFromWorld(wx, wy);
    if(edge) removeRoad(edge);
    return;
  }
  const cell = cellFromWorld(wx, wy);
  if(cell) placeBuilding(cell[0], cell[1]);
}

const pointers = new Map();
let lastDist = 0, dragStart = null, moved = false;

function twoDist(){
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  userInteracted = true;
  for(const t of e.changedTouches) pointers.set(t.identifier, {x:t.clientX, y:t.clientY});
  if(pointers.size === 1){
    const p = [...pointers.values()][0];
    dragStart = {x:p.x, y:p.y};
    moved = false;
  } else if(pointers.size === 2){
    lastDist = twoDist();
    moved = true;
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(pointers.has(t.identifier)) pointers.set(t.identifier, {x:t.clientX, y:t.clientY});
  }
  if(pointers.size === 1 && dragStart){
    const p = [...pointers.values()][0];
    const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    if(Math.hypot(dx, dy) > 8) moved = true;
    if(moved){
      offsetX += dx; offsetY += dy;
      dragStart = {x:p.x, y:p.y};
    }
  } else if(pointers.size === 2){
    const d = twoDist();
    if(lastDist > 0){
      const rect = canvas.getBoundingClientRect();
      const pts = [...pointers.values()];
      const cx = (pts[0].x + pts[1].x)/2 - rect.left;
      const cy = (pts[0].y + pts[1].y)/2 - rect.top;
      zoomAt(cx, cy, d/lastDist);
    }
    lastDist = d;
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for(const t of e.changedTouches) pointers.delete(t.identifier);
  if(pointers.size === 0){
    if(!moved && dragStart){
      const rect = canvas.getBoundingClientRect();
      handleTap(dragStart.x - rect.left, dragStart.y - rect.top);
    }
    dragStart = null; moved = false; lastDist = 0;
  } else if(pointers.size === 1){
    const p = [...pointers.values()][0];
    dragStart = {x:p.x, y:p.y};
    lastDist = 0;
  }
}, {passive:false});

canvas.addEventListener('mousedown', e => {
  userInteracted = true;
  dragStart = {x:e.clientX, y:e.clientY};
  moved = false;
});
canvas.addEventListener('mousemove', e => {
  if(!dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if(Math.hypot(dx, dy) > 8) moved = true;
  if(moved){ offsetX += dx; offsetY += dy; dragStart = {x:e.clientX, y:e.clientY}; }
});
canvas.addEventListener('mouseup', e => {
  if(!moved && dragStart){
    const rect = canvas.getBoundingClientRect();
    handleTap(e.clientX - rect.left, e.clientY - rect.top);
  }
  dragStart = null; moved = false;
});

// ========== Toolbar ==========
const toolbar = document.getElementById('toolbar');
function refreshToolbar(){
  if(!toolbar) return;
  toolbar.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === state.tool);
  });
}
function buildToolbar(){
  if(!toolbar) return;
  toolbar.innerHTML = '';
  for(const t of TOOLS){
    const btn = document.createElement('button');
    btn.dataset.tool = t;
    if(t === 'demolish'){
      btn.innerHTML = '拆除<small>&nbsp;</small>';
    } else if(t === 'road'){
      btn.innerHTML = '路<small>$10</small>';
    } else {
      btn.innerHTML = BUILDINGS[t].name + '<small>$' + BUILDINGS[t].cost + '</small>';
    }
    btn.addEventListener('click', () => { state.tool = t; refreshToolbar(); });
    toolbar.appendChild(btn);
  }
  refreshToolbar();
}

function buildTimeButtons(){
  document.querySelectorAll('#timeRow button[data-speed]').forEach(b => {
    b.onclick = () => {
      state.speed = parseInt(b.dataset.speed, 10);
      document.querySelectorAll('#timeRow button[data-speed]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    b.classList.toggle('active', parseInt(b.dataset.speed, 10) === state.speed);
  });
}

// ========== 屏幕切换 ==========
let screen = 'menu';
let settingsFrom = 'menu';

function updateContinueButton(){
  const btn = document.getElementById('btnContinue');
  if(!btn) return;
  if(hasSave()){
    btn.disabled = false;
    btn.textContent = '继续游戏';
  } else {
    btn.disabled = true;
    btn.textContent = '继续游戏（无存档）';
  }
}

function updateSettingsUI(){
  const fromGame = settingsFrom === 'game';
  document.getElementById('btnCloseSettings').textContent = fromGame ? '继续游戏' : '关闭设置';
  document.getElementById('btnBackToMenu').style.display = fromGame ? 'block' : 'none';
  document.getElementById('btnRestart').style.display    = fromGame ? 'block' : 'none';
  document.getElementById('btnQuit').style.display       = fromGame ? 'block' : 'none';
}

function showScreen(name){
  screen = name;
  document.getElementById('menuScreen').style.display    = (name === 'menu')     ? 'flex' : 'none';
  document.getElementById('gameScreen').style.display    = (name === 'game')     ? 'flex' : 'none';
  document.getElementById('settingsPanel').style.display = (name === 'settings') ? 'flex' : 'none';
  if(name === 'game'){
    requestAnimationFrame(() => {
      resize();
      if(!userInteracted) fitView();
    });
  }
  if(name === 'menu') updateContinueButton();
  if(name === 'settings') updateSettingsUI();
}

function enterGame(){
  buildToolbar();
  buildTimeButtons();
  lastUI = {};
  showScreen('game');
}

function newGame(){
  resetState();
  save();
  userInteracted = false;
  enterGame();
  setTimeout(() => toast('先铺路，再建电厂/水厂/住宅/工业/贸易站'), 400);
}

function continueGame(){
  load();
  userInteracted = false;
  enterGame();
}

// ========== 事件绑定 ==========
document.getElementById('btnNew').onclick = newGame;
document.getElementById('btnContinue').onclick = continueGame;
document.getElementById('btnMenuSettings').onclick = () => {
  settingsFrom = 'menu';
  showScreen('settings');
};
document.getElementById('btnOpenSettings').onclick = () => {
  settingsFrom = 'game';
  showScreen('settings');
};
document.getElementById('btnCloseSettings').onclick = () => {
  showScreen(settingsFrom === 'game' ? 'game' : 'menu');
};
document.getElementById('btnBackToMenu').onclick = () => {
  save();
  showScreen('menu');
};
document.getElementById('btnRestart').onclick = () => {
  if(confirm('确定要重新开始吗？当前进度将被清空。')){
    newGame();
  }
};
document.getElementById('btnQuit').onclick = () => {
  if(!confirm('确定要关闭游戏吗？进度会自动保存。')) return;
  save();
  try { window.close(); } catch(e){}
  showScreen('menu');
};

// ========== 主循环 ==========
let lastTime = performance.now();
let acc = 0;
function loop(now){
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  if(screen === 'game'){
    if(state.speed > 0){
      acc += dt * state.speed;
      let guard = 0;
      while(acc >= 1000 && guard < 10){
        acc -= 1000;
        tick();
        guard++;
      }
      updateAgents((dt * state.speed) / 1000);
    }
    render();
    updateUI();
  }
  requestAnimationFrame(loop);
}

// ========== 启动 ==========
updateContinueButton();
showScreen('menu');
requestAnimationFrame(loop);

})();
</script>
