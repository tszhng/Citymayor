<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷你城市 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#1e1e1e;color:#eee;
  font-family:-apple-system,"PingFang HK","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;}
#gameScreen{position:absolute;inset:0;display:flex;flex-direction:column;}
#topbar{flex:0 0 auto;background:#2b2b2b;padding:6px 8px;font-size:13px;}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.row+.row{margin-top:6px;}
button{background:#3a3a3a;color:#eee;border:1px solid #555;border-radius:6px;
  padding:4px 8px;font-size:13px;cursor:pointer;font-family:inherit;}
button.active{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.res{display:flex;gap:10px;flex-wrap:wrap;}
.res span{white-space:nowrap;}
.res b{margin-left:2px;color:#ffd54f;font-weight:600;}
.res b.bad{color:#ff5050;}
#tickInfo{color:#888;font-size:11px;}
#dayInfo{color:#ffd54f;font-size:12px;font-weight:600;}
#canvasWrap{flex:1 1 auto;position:relative;overflow:hidden;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#toolbar{flex:0 0 auto;background:#2b2b2b;display:flex;gap:6px;padding:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
#toolbar button{flex:0 0 auto;padding:8px 10px;font-size:12px;line-height:1.2;
  text-align:center;min-width:56px;}
#toolbar button small{display:block;color:#ffd54f;font-size:10px;margin-top:2px;}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.88);padding:10px 16px;border-radius:8px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:5;}
#toast.show{opacity:1;}
.menu-btn{width:240px;max-width:80vw;padding:14px 20px;font-size:16px;
  background:#3a3a3a;color:#eee;border:1px solid #555;border-radius:10px;
  cursor:pointer;font-family:inherit;transition:background .15s;}
.menu-btn:active{background:#4a4a4a;}
.menu-btn.primary{background:#4a90d9;border-color:#4a90d9;color:#fff;}
.menu-btn.danger{background:#8b3a3a;border-color:#a44;color:#fff;}
.menu-btn:disabled{opacity:.4;cursor:not-allowed;}
#menuScreen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(160deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);
  gap:14px;padding:24px;}
#menuScreen h1{font-size:34px;margin-bottom:20px;font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,#4a90d9,#e6a23c);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#menuScreen .sub{color:#8899aa;font-size:12px;margin-top:20px;}
#settingsPanel{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(0,0,0,0.88);
  gap:12px;padding:24px;}
#settingsPanel h2{font-size:24px;margin-bottom:20px;color:#fff;}
</style>
</head>
<body>
<div id="app">

  <div id="gameScreen">
    <div id="topbar">
      <div class="row" id="timeRow">
        <button data-speed="0">⏸</button>
        <button data-speed="1">▶1x</button>
        <button data-speed="3">▶3x</button>
        <span id="dayInfo"></span>
        <span id="tickInfo"></span>
        <button id="btnOpenSettings" style="margin-left:auto">⚙</button>
      </div>
      <div class="row res">
        <span>💰<b id="rMoney">0</b></span>
        <span>👥<b id="rPop">0</b></span>
        <span>⚡<b id="rPower">0/0</b></span>
        <span>💧<b id="rWater">0/0</b></span>
        <span>📦<b id="rGoods">0</b></span>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="toast"></div>
    </div>
    <div id="toolbar"></div>
  </div>

  <div id="menuScreen">
    <h1>🏙️ 迷你城市</h1>
    <button class="menu-btn primary" id="btnNew">开始新游戏</button>
    <button class="menu-btn" id="btnContinue" disabled>继续游戏</button>
    <button class="menu-btn" id="btnMenuSettings">设置</button>
    <div class="sub">v2.0 · 离线可玩 · 沙盒建造</div>
  </div>

  <div id="settingsPanel" style="display:none;">
    <h2>⚙ 设置</h2>
    <button class="menu-btn primary" id="btnCloseSettings">继续游戏</button>
    <button class="menu-btn" id="btnBackToMenu">保存并返回主菜单</button>
    <button class="menu-btn danger" id="btnRestart">重新开始（清空存档）</button>
    <button class="menu-btn danger" id="btnQuit">关闭游戏</button>
  </div>

</div>
<script> (function(){
'use strict';

// ========== 常量 ==========
const N = 10;
const CELL = 60;
const ROAD_WIDTH = 9;
const AGENT_RADIUS = 5;
const AGENT_SPEED = 90;            // 世界单位/秒
const MAX_AGENTS = 400;
const DAY_LENGTH = 48;             // 一天 48 tick
const MORNING_END = 33;            // 早上 tick 1..33，晚上 34..48
const MORNING_SPAWN_TICKS = 3;     // 早上头 3 tick 派工
const EVENING_HOME_TICKS = 3;      // 晚上头 3 tick 下班
const SAVE_KEY = 'minicity_v2';
const dpr = Math.min(window.devicePixelRatio || 1, 2);

// 产能 / 消耗
const WATER_PER_PLANT_PER_TICK = 5;
const POWER_PER_PLANT_PER_TICK = 6;
const WATER_PER_HOUSE_PER_TICK  = 0.2;
const POWER_PER_HOUSE_PER_TICK  = 0.25;
const WATER_PER_IND_PER_TICK    = 0.8;
const POWER_PER_IND_PER_TICK    = 1.2;
const GOODS_VALUE = 20;

const BUILDINGS = {
  house:    { name:'住宅', short:'住', color:'#4a90d9', cost:100, workerCap:0, residentCap:4 },
  industry: { name:'工业', short:'工', color:'#8d6e63', cost:150, workerCap:6 },
  power:    { name:'电厂', short:'电', color:'#e74c3c', cost:200, workerCap:1 },
  water:    { name:'水厂', short:'水', color:'#26c6da', cost:200, workerCap:1 },
  trade:    { name:'贸易', short:'贸', color:'#9b59b6', cost:250, workerCap:1, goodsPerTick:2 },
};

const TOOLS = ['road','house','industry','power','water','trade','demolish'];

// ========== 状态 ==========
const state = {
  money: 1500,
  tool: 'road',
  speed: 1,
  tick: 0,
  cells: [],
  edgesH: [],
  edgesV: [],
  agents: [],
  nextId: 1,
  waterSupply: 0, powerSupply: 0,
  waterDemand: 0, powerDemand: 0,
  waterOK: true, powerOK: true,
};

function initCellRuntime(cell){
  if(!cell) return;
  if(cell.type === 'house'){
    cell.residents = BUILDINGS.house.residentCap;
    cell.outCount = 0;
  } else {
    cell.workers = 0;
    cell.pendingIn = 0;
    cell.workerHomes = [];
    if(cell.type === 'trade') cell.goodsQueue = 0;
  }
}

function resetState(){
  state.money = 1500;
  state.tool = 'road';
  state.speed = 1;
  state.tick = 0;
  state.cells = Array.from({length:N}, () => Array(N).fill(null));
  state.edgesH = Array.from({length:N+1}, () => Array(N).fill(false));
  state.edgesV = Array.from({length:N}, () => Array(N+1).fill(false));
  state.agents = [];
  state.nextId = 1;
  state.waterSupply = 0; state.powerSupply = 0;
  state.waterDemand = 0; state.powerDemand = 0;
  state.waterOK = true; state.powerOK = true;
}
resetState();

// ========== 存档 ==========
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function save(){
  try {
    const cellsData = state.cells.map(row =>
      row.map(cell => cell ? { type: cell.type } : null)
    );
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money: state.money, tick: state.tick,
      cells: cellsData,
      edgesH: state.edgesH, edgesV: state.edgesV,
    }));
  } catch(e){}
}
function load(){
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return false;
    const d = JSON.parse(s);
    state.money = typeof d.money === 'number' ? d.money : 1500;
    state.tick = d.tick || 0;
    state.cells = d.cells || Array.from({length:N}, () => Array(N).fill(null));
    state.edgesH = d.edgesH || Array.from({length:N+1}, () => Array(N).fill(false));
    state.edgesV = d.edgesV || Array.from({length:N}, () => Array(N+1).fill(false));
    if(state.cells.length !== N) resetState();
    if(state.edgesH.length !== N+1) state.edgesH = Array.from({length:N+1}, () => Array(N).fill(false));
    if(state.edgesV.length !== N) state.edgesV = Array.from({length:N}, () => Array(N+1).fill(false));
    for(let r = 0; r < N; r++){
      for(let c = 0; c < N; c++){
        if(state.cells[r][c]) initCellRuntime(state.cells[r][c]);
      }
    }
    state.agents = [];
    state.nextId = 1;
    return true;
  } catch(e){ return false; }
}

// ========== Canvas / 视口 ==========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scale = 1, offsetX = 0, offsetY = 0;
let userInteracted = false;

function fitView(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(w <= 0 || h <= 0) return;
  const total = N * CELL;
  scale = Math.min(w/total, h/total) * 0.92;
  offsetX = (w - total*scale) / 2;
  offsetY = (h - total*scale) / 2;
}
function resize(){
  const wrap = document.getElementById('canvasWrap');
  if(!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = Math.max(1, w*dpr);
  canvas.height = Math.max(1, h*dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  if(!userInteracted) fitView();
}
window.addEventListener('resize', resize);

function zoomAt(cx, cy, factor){
  const newScale = Math.max(0.3, Math.min(4, scale*factor));
  const wx = (cx - offsetX) / scale;
  const wy = (cy - offsetY) / scale;
  scale = newScale;
  offsetX = cx - wx*scale;
  offsetY = cy - wy*scale;
}

// ========== 坐标 ==========
function cellFromWorld(wx, wy){
  const c = Math.floor(wx / CELL);
  const r = Math.floor(wy / CELL);
  if(r < 0 || r >= N || c < 0 || c >= N) return null;
  return [r, c];
}

function edgeFromWorld(wx, wy){
  const hRow = Math.round(wy / CELL);
  const hCol = Math.floor(wx / CELL);
  const hDist = Math.abs(wy - hRow*CELL);
  const hValid = hRow >= 0 && hRow <= N && hCol >= 0 && hCol < N && wx >= 0 && wx <= N*CELL;

  const vCol = Math.round(wx / CELL);
  const vRow = Math.floor(wy / CELL);
  const vDist = Math.abs(wx - vCol*CELL);
  const vValid = vCol >= 0 && vCol <= N && vRow >= 0 && vRow < N && wy >= 0 && wy <= N*CELL;

  if(!hValid && !vValid) return null;
  if(hValid && (!vValid || hDist <= vDist)) return { type:'h', r:hRow, c:hCol, dist:hDist };
  return { type:'v', r:vRow, c:vCol, dist:vDist };
}

// ========== 图 ==========
function cellEntryNodes(r, c){
  const set = new Set();
  if(state.edgesH[r] && state.edgesH[r][c]){
    set.add(r+','+c); set.add(r+','+(c+1));
  }
  if(state.edgesH[r+1] && state.edgesH[r+1][c]){
    set.add((r+1)+','+c); set.add((r+1)+','+(c+1));
  }
  if(state.edgesV[r] && state.edgesV[r][c]){
    set.add(r+','+c); set.add((r+1)+','+c);
  }
  if(state.edgesV[r] && state.edgesV[r][c+1]){
    set.add(r+','+(c+1)); set.add((r+1)+','+(c+1));
  }
  return [...set].map(s => s.split(',').map(Number));
}

function nodeNeighbors(r, c){
  const ns = [];
  if(r >= 0 && r <= N && c >= 0 && c < N && state.edgesH[r] && state.edgesH[r][c]) ns.push([r, c+1]);
  if(r >= 0 && r <= N && c > 0 && state.edgesH[r] && state.edgesH[r][c-1]) ns.push([r, c-1]);
  if(r >= 0 && r < N && c >= 0 && c <= N && state.edgesV[r] && state.edgesV[r][c]) ns.push([r+1, c]);
  if(r > 0 && r <= N && c >= 0 && c <= N && state.edgesV[r-1] && state.edgesV[r-1][c]) ns.push([r-1, c]);
  return ns;
}

function findPathBFS(starts, goals){
  if(starts.length === 0 || goals.length === 0) return null;
  const goalSet = new Set(goals.map(([r,c]) => r+','+c));
  const visited = new Map();
  const queue = [];
  for(const [r,c] of starts){
    const k = r+','+c;
    if(!visited.has(k)){ visited.set(k, null); queue.push(k); }
  }
  while(queue.length > 0){
    const cur = queue.shift();
    if(goalSet.has(cur)){
      const path = [];
      let k = cur;
      while(k !== null){
        const [r,c] = k.split(',').map(Number);
        path.unshift([r, c]);
        k = visited.get(k);
      }
      return path;
    }
    const [r, c] = cur.split(',').map(Number);
    for(const [nr, nc] of nodeNeighbors(r, c)){
      const nk = nr+','+nc;
      if(!visited.has(nk)){ visited.set(nk, cur); queue.push(nk); }
    }
  }
  return null;
}

function findPathBetweenCells(from, to){
  return findPathBFS(cellEntryNodes(from[0], from[1]), cellEntryNodes(to[0], to[1]));
}

function nodesToEdges(nodes){
  const edges = [];
  for(let i = 0; i < nodes.length - 1; i++){
    edges.push({ from: nodes[i], to: nodes[i+1] });
  }
  return edges;
}

// ========== Agent ==========
function spawnAgent(kind, fromCell, toCell, homeKey){
  if(state.agents.length >= MAX_AGENTS) return false;
  const nodePath = findPathBetweenCells(fromCell, toCell);
  if(!nodePath || nodePath.length < 2) return false;
  state.agents.push({
    id: state.nextId++,
    kind: kind,
    homeKey: homeKey || null,
    path: nodesToEdges(nodePath),
    pathIndex: 0,
    progress: 0,
    destCell: toCell,
  });
  return true;
}

function onAgentArrive(a){
  const [r, c] = a.destCell;
  const cell = state.cells[r] && state.cells[r][c];
  if(!cell) return;
  if(a.kind === 'worker'){
    cell.workers = (cell.workers || 0) + 1;
    if(a.homeKey) cell.workerHomes.push(a.homeKey);
  } else if(a.kind === 'home'){
    if(cell.type === 'house'){
      cell.outCount = Math.max(0, (cell.outCount || 0) - 1);
    }
  } else if(a.kind === 'goods'){
    if(cell.type === 'trade'){
      cell.goodsQueue = (cell.goodsQueue || 0) + 1;
    }
  }
}

function updateAgents(dt){
  const step = AGENT_SPEED * dt;
  for(let i = state.agents.length - 1; i >= 0; i--){
    const a = state.agents[i];
    let remain = step;
    while(remain > 0 && a.pathIndex < a.path.length){
      const remainingOnEdge = (1 - a.progress) * CELL;
      if(remain >= remainingOnEdge){
        remain -= remainingOnEdge;
        a.progress = 0;
        a.pathIndex++;
      } else {
        a.progress += remain / CELL;
        remain = 0;
      }
    }
    if(a.pathIndex >= a.path.length){
      onAgentArrive(a);
      state.agents.splice(i, 1);
    }
  }
}

// ========== 时间 ==========
function currentDayTick(){
  if(state.tick === 0) return 1;
  return ((state.tick - 1) % DAY_LENGTH) + 1;
}
function isMorningNow(){
  return currentDayTick() <= MORNING_END;
}

// ========== Tick ==========
function tick(){
  const dayTick = (state.tick % DAY_LENGTH) + 1;   // 即将进入的 dayTick
  state.tick++;
  const isMorning = dayTick <= MORNING_END;

  // 收集
  const houses = [], industries = [], powers = [], waters = [], trades = [];
  const allWork = []; // [r,c,cell]
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(!cell) continue;
      switch(cell.type){
        case 'house':    houses.push([r,c,cell]); break;
        case 'industry': industries.push([r,c,cell]); allWork.push([r,c,cell]); break;
        case 'power':    powers.push([r,c,cell]);     allWork.push([r,c,cell]); break;
        case 'water':    waters.push([r,c,cell]);     allWork.push([r,c,cell]); break;
        case 'trade':    trades.push([r,c,cell]);     allWork.push([r,c,cell]); break;
      }
    }
  }

  // 重算 pendingIn（每 tick 从 agents 推导，避免路断时容量卡死）
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(cell && cell.type !== 'house') cell.pendingIn = 0;
    }
  }
  for(const a of state.agents){
    if(a.kind === 'worker'){
      const cell = state.cells[a.destCell[0]] && state.cells[a.destCell[0]][a.destCell[1]];
      if(cell) cell.pendingIn = (cell.pendingIn || 0) + 1;
    }
  }

  // 资源结算（基于当前到岗 workers）
  let ws = 0, ps = 0, wd = 0, pd = 0;
  for(const [, , p] of powers) if(p.workers > 0) ps += POWER_PER_PLANT_PER_TICK;
  for(const [, , w] of waters) if(w.workers > 0) ws += WATER_PER_PLANT_PER_TICK;
  for(const [, , h] of houses){ wd += WATER_PER_HOUSE_PER_TICK; pd += POWER_PER_HOUSE_PER_TICK; }
  for(const [, , ind] of industries){
    if(ind.workers > 0){ wd += WATER_PER_IND_PER_TICK; pd += POWER_PER_IND_PER_TICK; }
  }
  state.waterSupply = ws; state.powerSupply = ps;
  state.waterDemand = wd; state.powerDemand = pd;
  state.waterOK = ws >= wd - 1e-9;
  state.powerOK = ps >= pd - 1e-9;

  // 早上头 3 tick：住宅派工（不受资源限制，避免初始死锁）
  if(isMorning && dayTick <= MORNING_SPAWN_TICKS){
    for(const [r, c, h] of houses){
      let toSend = (h.residents || 0) - (h.outCount || 0);
      while(toSend > 0){
        let best = null, bestD = Infinity;
        for(const [wr, wc, w] of allWork){
          const cap = BUILDINGS[w.type].workerCap;
          if(cap <= 0) continue;
          if((w.workers || 0) + (w.pendingIn || 0) >= cap) continue;
          const d = Math.abs(wr - r) + Math.abs(wc - c);
          if(d < bestD){ bestD = d; best = [wr, wc, w]; }
        }
        if(!best) break;
        const [wr, wc, w] = best;
        if(spawnAgent('worker', [r, c], [wr, wc], r+','+c)){
          h.outCount = (h.outCount || 0) + 1;
          toSend--;
        } else break;
      }
    }
  }

  // 晚上头 3 tick：下班回家
  if(!isMorning && (dayTick - MORNING_END) <= EVENING_HOME_TICKS){
    for(const [r, c, w] of allWork){
      while((w.workers || 0) > 0 && w.workerHomes.length > 0){
        const homeKey = w.workerHomes.pop();
        const [hr, hc] = homeKey.split(',').map(Number);
        w.workers--;
        spawnAgent('home', [r, c], [hr, hc], homeKey);
      }
    }
  }

  // 工业产货（有人 + 资源充足 + 有贸易站）
  if(state.waterOK && state.powerOK && trades.length > 0){
    for(const [r, c, ind] of industries){
      if((ind.workers || 0) <= 0) continue;
      let best = null, bestD = Infinity;
      for(const [tr, tc, t] of trades){
        const d = Math.abs(tr - r) + Math.abs(tc - c);
        if(d < bestD){ bestD = d; best = [tr, tc, t]; }
      }
      if(best) spawnAgent('goods', [r, c], [best[0], best[1]], null);
    }
  }

  // 贸易站处理货物（有人才处理）
  for(const [, , t] of trades){
    if((t.workers || 0) <= 0) continue;
    const process = Math.min(t.goodsQueue || 0, BUILDINGS.trade.goodsPerTick);
    if(process > 0){
      t.goodsQueue -= process;
      state.money += process * GOODS_VALUE;
    }
  }

  // 维护费
  state.money -= powers.length * 3;
  state.money -= waters.length * 2;
  state.money -= trades.length * 2;

  if(state.tick % DAY_LENGTH === 0) save();
}

// ========== 放置 / 拆除 ==========
function placeRoad(edge){
  const arr = edge.type === 'h' ? state.edgesH : state.edgesV;
  if(!arr[edge.r] || arr[edge.r][edge.c] === undefined) return;
  if(arr[edge.r][edge.c]){ toast('这里已经有路了'); return; }
  if(state.money < 10){ toast('资金不足'); return; }
  state.money -= 10;
  arr[edge.r][edge.c] = true;
  save();
}

function removeRoad(edge){
  const arr = edge.type === 'h' ? state.edgesH : state.edgesV;
  if(!arr[edge.r] || !arr[edge.r][edge.c]) return false;
  arr[edge.r][edge.c] = false;
  state.money += 5;
  save();
  return true;
}

function placeBuilding(r, c){
  if(state.cells[r][c]){ toast('这里已经有建筑了'); return; }
  const type = state.tool;
  const b = BUILDINGS[type];
  if(!b) return;

  if(type === 'trade'){
    if(!(r === 0 || r === N-1 || c === 0 || c === N-1)){
      toast('贸易站必须建在地图边缘');
      return;
    }
  }

  const hasAdjacentRoad =
    (state.edgesH[r] && state.edgesH[r][c]) ||
    (state.edgesH[r+1] && state.edgesH[r+1][c]) ||
    (state.edgesV[r] && state.edgesV[r][c]) ||
    (state.edgesV[r] && state.edgesV[r][c+1]);
  if(!hasAdjacentRoad){
    toast('建筑必须紧挨着路');
    return;
  }

  if(state.money < b.cost){ toast('资金不足'); return; }
  state.money -= b.cost;
  state.cells[r][c] = { type: type };
  initCellRuntime(state.cells[r][c]);
  save();
}

function removeBuilding(r, c){
  const cell = state.cells[r][c];
  if(!cell) return false;
  state.money += Math.floor(BUILDINGS[cell.type].cost / 2);
  state.cells[r][c] = null;
  save();
  return true;
}

// ========== 渲染 ==========
function roundRectPath(x, y, w, h, r){
  if(r > w/2) r = w/2;
  if(r > h/2) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const PAD = 8;
const CORNER = 10;

function cellIsActive(cell){
  if(!cell) return false;
  switch(cell.type){
    case 'house':    return true;
    case 'industry': return (cell.workers || 0) > 0 && state.waterOK && state.powerOK;
    default:         return (cell.workers || 0) > 0;
  }
}

function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#161616';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, dpr*offsetX, dpr*offsetY);

  // 1. 格子背景
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const x = c*CELL + PAD;
      const y = r*CELL + PAD;
      const w = CELL - PAD*2;
      roundRectPath(x, y, w, w, CORNER);
      ctx.fillStyle = '#282828';
      ctx.fill();
    }
  }

  // 2. 道路
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#555';
  ctx.lineWidth = ROAD_WIDTH;

  for(let r = 0; r <= N; r++){
    for(let c = 0; c < N; c++){
      if(state.edgesH[r] && state.edgesH[r][c]){
        ctx.beginPath();
        ctx.moveTo(c*CELL, r*CELL);
        ctx.lineTo((c+1)*CELL, r*CELL);
        ctx.stroke();
      }
    }
  }
  for(let r = 0; r < N; r++){
    for(let c = 0; c <= N; c++){
      if(state.edgesV[r] && state.edgesV[r][c]){
        ctx.beginPath();
        ctx.moveTo(c*CELL, r*CELL);
        ctx.lineTo(c*CELL, (r+1)*CELL);
        ctx.stroke();
      }
    }
  }

  // 3. 建筑
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(!cell) continue;
      const b = BUILDINGS[cell.type];
      const x = c*CELL + PAD;
      const y = r*CELL + PAD;
      const w = CELL - PAD*2;
      const active = cellIsActive(cell);

      roundRectPath(x, y, w, w, CORNER);
      ctx.globalAlpha = active ? 1 : 0.45;
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.short, x + w/2, y + w/2 - 4);

      if(!active){
        ctx.fillStyle = '#ff5050';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('!', x + w/2, y + 14);
      }

      // 工人数 / 居民数
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      if(cell.type === 'house'){
        ctx.fillText('👤' + (cell.residents || 0), x + w/2, y + w - 9);
      } else if(BUILDINGS[cell.type].workerCap > 0){
        ctx.fillText('👷' + (cell.workers || 0) + '/' + BUILDINGS[cell.type].workerCap, x + w/2, y + w - 9);
      }
      if(cell.type === 'trade' && (cell.goodsQueue || 0) > 0){
        ctx.fillStyle = '#ffd54f';
        ctx.fillText('📦' + cell.goodsQueue, x + w/2, y + w - 21);
      }
    }
  }

  // 4. Agent
  for(const a of state.agents){
    if(a.pathIndex >= a.path.length) continue;
    const e = a.path[a.pathIndex];
    const fx = e.from[1]*CELL;
    const fy = e.from[0]*CELL;
    const tx = e.to[1]*CELL;
    const ty = e.to[0]*CELL;
    const px = fx + (tx - fx) * a.progress;
    const py = fy + (ty - fy) * a.progress;

    ctx.beginPath();
    ctx.arc(px, py, AGENT_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = a.kind === 'goods' ? '#e67e22' : '#2ecc71';
    ctx.fill();
  }
}

// ========== UI 更新 ==========
let lastUI = {};
function updateUI(){
  let pop = 0, goodsInTrades = 0;
  for(let r = 0; r < N; r++){
    for(let c = 0; c < N; c++){
      const cell = state.cells[r][c];
      if(!cell) continue;
      if(cell.type === 'house') pop += cell.residents || 0;
      else if(cell.type === 'trade') goodsInTrades += cell.goodsQueue || 0;
    }
  }
  const day = Math.floor(((state.tick === 0 ? 0 : state.tick - 1)) / DAY_LENGTH) + 1;
  const isM = isMorningNow();

  const powerStr = state.powerSupply.toFixed(1) + '/' + state.powerDemand.toFixed(1);
  const waterStr = state.waterSupply.toFixed(1) + '/' + state.waterDemand.toFixed(1);

  const vals = {
    rMoney: Math.floor(state.money),
    rPop: pop,
    rPower: powerStr,
    rWater: waterStr,
    rGoods: goodsInTrades,
    dayInfo: (isM ? '☀' : '🌙') + ' Day ' + day,
    tickInfo: 'tick ' + state.tick,
  };
  for(const k in vals){
    if(lastUI[k] !== vals[k]){
      const el = document.getElementById(k);
      if(el) el.textContent = vals[k];
      lastUI[k] = vals[k];
    }
  }
  const pwEl = document.getElementById('rPower');
  const wtEl = document.getElementById('rWater');
  if(pwEl) pwEl.classList.toggle('bad', !state.powerOK);
  if(wtEl) wtEl.classList.toggle('bad', !state.waterOK);
}

// ========== 输入 ==========
function toast(msg){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1400);
}

function handleTap(cssX, cssY){
  const wx = (cssX - offsetX) / scale;
  const wy = (cssY - offsetY) / scale;

  if(state.tool === 'road'){
    const edge = edgeFromWorld(wx, wy);
    if(edge) placeRoad(edge);
    return;
  }
  if(state.tool === 'demolish'){
    const cell = cellFromWorld(wx, wy);
    if(cell && state.cells[cell[0]][cell[1]]){
      removeBuilding(cell[0], cell[1]);
      return;
    }
    const edge = edgeFromWorld(wx, wy);
    if(edge) removeRoad(edge);
    return;
  }
  const cell = cellFromWorld(wx, wy);
  if(cell) placeBuilding(cell[0], cell[1]);
}

const pointers = new Map();
let lastDist = 0, dragStart = null, moved = false;

function twoDist(){
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  userInteracted = true;
  for(const t of e.changedTouches) pointers.set(t.identifier, {x:t.clientX, y:t.clientY});
  if(pointers.size === 1){
    const p = [...pointers.values()][0];
    dragStart = {x:p.x, y:p.y};
    moved = false;
  } else if(pointers.size === 2){
    lastDist = twoDist();
    moved = true;
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(pointers.has(t.identifier)) pointers.set(t.identifier, {x:t.clientX, y:t.clientY});
  }
  if(pointers.size === 1 && dragStart){
    const p = [...pointers.values()][0];
    const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    if(Math.hypot(dx, dy) > 8) moved = true;
    if(moved){
      offsetX += dx; offsetY += dy;
      dragStart = {x:p.x, y:p.y};
    }
  } else if(pointers.size === 2){
    const d = twoDist();
    if(lastDist > 0){
      const rect = canvas.getBoundingClientRect();
      const pts = [...pointers.values()];
      const cx = (pts[0].x + pts[1].x)/2 - rect.left;
      const cy = (pts[0].y + pts[1].y)/2 - rect.top;
      zoomAt(cx, cy, d/lastDist);
    }
    lastDist = d;
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for(const t of e.changedTouches) pointers.delete(t.identifier);
  if(pointers.size === 0){
    if(!moved && dragStart){
      const rect = canvas.getBoundingClientRect();
      handleTap(dragStart.x - rect.left, dragStart.y - rect.top);
    }
    dragStart = null; moved = false; lastDist = 0;
  } else if(pointers.size === 1){
    const p = [...pointers.values()][0];
    dragStart = {x:p.x, y:p.y};
    lastDist = 0;
  }
}, {passive:false});

canvas.addEventListener('mousedown', e => {
  userInteracted = true;
  dragStart = {x:e.clientX, y:e.clientY};
  moved = false;
});
canvas.addEventListener('mousemove', e => {
  if(!dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if(Math.hypot(dx, dy) > 8) moved = true;
  if(moved){ offsetX += dx; offsetY += dy; dragStart = {x:e.clientX, y:e.clientY}; }
});
canvas.addEventListener('mouseup', e => {
  if(!moved && dragStart){
    const rect = canvas.getBoundingClientRect();
    handleTap(e.clientX - rect.left, e.clientY - rect.top);
  }
  dragStart = null; moved = false;
});

// ========== Toolbar ==========
const toolbar = document.getElementById('toolbar');
function refreshToolbar(){
  if(!toolbar) return;
  toolbar.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === state.tool);
  });
}
function buildToolbar(){
  if(!toolbar) return;
  toolbar.innerHTML = '';
  for(const t of TOOLS){
    const btn = document.createElement('button');
    btn.dataset.tool = t;
    if(t === 'demolish'){
      btn.innerHTML = '拆除<small>&nbsp;</small>';
    } else if(t === 'road'){
      btn.innerHTML = '路<small>$10</small>';
    } else {
      btn.innerHTML = BUILDINGS[t].name + '<small>$' + BUILDINGS[t].cost + '</small>';
    }
    btn.addEventListener('click', () => { state.tool = t; refreshToolbar(); });
    toolbar.appendChild(btn);
  }
  refreshToolbar();
}

function buildTimeButtons(){
  document.querySelectorAll('#timeRow button[data-speed]').forEach(b => {
    b.onclick = () => {
      state.speed = parseInt(b.dataset.speed, 10);
      document.querySelectorAll('#timeRow button[data-speed]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    };
    b.classList.toggle('active', parseInt(b.dataset.speed, 10) === state.speed);
  });
}

// ========== 屏幕切换 ==========
let screen = 'menu';
let settingsFrom = 'menu';

function updateContinueButton(){
  const btn = document.getElementById('btnContinue');
  if(!btn) return;
  if(hasSave()){
    btn.disabled = false;
    btn.textContent = '继续游戏';
  } else {
    btn.disabled = true;
    btn.textContent = '继续游戏（无存档）';
  }
}

function updateSettingsUI(){
  const fromGame = settingsFrom === 'game';
  document.getElementById('btnCloseSettings').textContent = fromGame ? '继续游戏' : '关闭设置';
  document.getElementById('btnBackToMenu').style.display = fromGame ? 'block' : 'none';
  document.getElementById('btnRestart').style.display    = fromGame ? 'block' : 'none';
  document.getElementById('btnQuit').style.display       = fromGame ? 'block' : 'none';
}

function showScreen(name){
  screen = name;
  document.getElementById('menuScreen').style.display    = (name === 'menu')     ? 'flex' : 'none';
  document.getElementById('gameScreen').style.display    = (name === 'game')     ? 'flex' : 'none';
  document.getElementById('settingsPanel').style.display = (name === 'settings') ? 'flex' : 'none';
  if(name === 'game'){
    requestAnimationFrame(() => {
      resize();
      if(!userInteracted) fitView();
    });
  }
  if(name === 'menu') updateContinueButton();
  if(name === 'settings') updateSettingsUI();
}

function enterGame(){
  buildToolbar();
  buildTimeButtons();
  lastUI = {};
  showScreen('game');
}

function newGame(){
  resetState();
  save();
  userInteracted = false;
  enterGame();
  setTimeout(() => toast('先铺路，再建水厂/电厂/住宅/工业/贸易站'), 400);
}

function continueGame(){
  load();
  userInteracted = false;
  enterGame();
}

// ========== 事件绑定 ==========
document.getElementById('btnNew').onclick = newGame;
document.getElementById('btnContinue').onclick = continueGame;
document.getElementById('btnMenuSettings').onclick = () => {
  settingsFrom = 'menu';
  showScreen('settings');
};
document.getElementById('btnOpenSettings').onclick = () => {
  settingsFrom = 'game';
  showScreen('settings');
};
document.getElementById('btnCloseSettings').onclick = () => {
  showScreen(settingsFrom === 'game' ? 'game' : 'menu');
};
document.getElementById('btnBackToMenu').onclick = () => {
  save();
  showScreen('menu');
};
document.getElementById('btnRestart').onclick = () => {
  if(confirm('确定要重新开始吗？当前进度将被清空。')){
    newGame();
  }
};
document.getElementById('btnQuit').onclick = () => {
  if(!confirm('确定要关闭游戏吗？进度会自动保存。')) return;
  save();
  try { window.close(); } catch(e){}
  showScreen('menu');
};

// ========== 主循环 ==========
let lastTime = performance.now();
let acc = 0;
function loop(now){
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;
  if(screen === 'game'){
    if(state.speed > 0){
      acc += dt * state.speed;
      let guard = 0;
      while(acc >= 1000 && guard < 10){
        acc -= 1000;
        tick();
        guard++;
      }
      updateAgents((dt * state.speed) / 1000);
    }
    render();
    updateUI();
  }
  requestAnimationFrame(loop);
}

// ========== 启动 ==========
updateContinueButton();
showScreen('menu');
requestAnimationFrame(loop);

})();
</script>
